# Python environment for the pipeline (01-04), the analyses (analyses/) and the figures (figures/).
# Versions are those of the conda-forge environment the analyses under analyses/ ran in (macOS arm64).
#   conda env create -f environment.yml && conda activate flood-adaptation-control
#
# C++ compiler: needed only to rerun analyses that use the compiled kernels (analyses/common/build_kernels.sh),
# not for figures and tables from the archived data. macOS: Xcode Command Line Tools (clang++, Accelerate
# framework; `xcode-select --install`). Linux: g++ and a CBLAS with its header, for example
# `conda install -c conda-forge cxx-compiler blas-devel`.
name: flood-adaptation-control
channels:
  - conda-forge
dependencies:
  - python=3.12.14
  - numpy=2.5.2
  - scipy=1.18.0
  - pandas=3.0.5
  - pyarrow=25.0.0
  - scikit-learn=1.9.0
  - threadpoolctl=3.6.0
  - geopandas=1.1.4
  - pyogrio=0.13.0
  - shapely=2.1.2
  - matplotlib=3.11.1
  - nbformat=5.11.1
  - nbclient=0.11.0
  - ipykernel=7.3.0
  - xarray=2026.7.0
  - netcdf4=1.7.4
  - joblib=1.5.3
  - requests=2.34.2
  # Used only by the data notebooks 01-03 (download, streamflow and precipitation processing); no version is pinned.
  - tqdm
  - exactextract
